<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Полевой журнал обследования</title>
<style>
:root{
  --paper:#f4f6f5; --sheet:#ffffff; --sheet-2:#e9eef0; --rule:#cdd5da; --ink:#14202a; --ink-2:#56636d;
  --axis:#1d4f7a; --axis-soft:#dbe7f1; --mark:#c8202f; --mark-ink:#ffffff; --mark-soft:#f8dfe1;
  --ok:#2c7a4b; --ok-soft:#dbeee2; --warn:#975800; --warn-soft:#f6e7c8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabs-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1820; --sheet:#15222c; --sheet-2:#1c2c38; --rule:#2a3c4a; --ink:#e2e9ee; --ink-2:#93a3af;
    --axis:#86bce8; --axis-soft:#1b3347; --mark:#ff5c63; --mark-ink:#230507; --mark-soft:#3d1a1e;
    --ok:#6fd09a; --ok-soft:#173326; --warn:#f2b552; --warn-soft:#38290f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0e1820; --sheet:#15222c; --sheet-2:#1c2c38; --rule:#2a3c4a; --ink:#e2e9ee; --ink-2:#93a3af;
    --axis:#86bce8; --axis-soft:#1b3347; --mark:#ff5c63; --mark-ink:#230507; --mark-soft:#3d1a1e;
    --ok:#6fd09a; --ok-soft:#173326; --warn:#f2b552; --warn-soft:#38290f;
    color-scheme:dark;
  }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--sans);font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--axis);outline-offset:2px}

/* шапка */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--paper);border-bottom:1px solid var(--rule)}
.obj-btn{display:flex;align-items:center;gap:6px;min-width:0;flex:1;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer}
.obj-name{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj-btn svg{flex:none;color:var(--ink-2)}
.top-count{flex:none;font-size:14px;color:var(--ink-2)}

main{max-width:760px;margin:0 auto;padding:12px 16px}

/* нижние вкладки */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sheet);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;color:var(--ink-2);font-size:12.5px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="page"] svg{color:var(--mark)}

.fab{position:fixed;right:16px;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:15;
  height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--mark);color:var(--mark-ink);
  font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--mark) 70%,transparent)}
.fab[hidden]{display:none}

/* поиск и фильтры */
.search{width:100%;font-size:16px;padding:11px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:18px;padding:7px 13px;font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.summary{font-size:14px;color:var(--ink-2);margin:8px 0}

/* ведомость: строки дефектов */
.ledger{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:48px 1fr;gap:0 10px;padding:12px 14px 12px 8px;border-top:1px solid var(--rule);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--sheet-2)}
.row-no{justify-self:center;align-self:start;min-width:34px;height:28px;padding:0 6px;border-radius:14px;border:1.5px solid var(--mark);
  color:var(--mark);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center}
.row.sev-критический .row-no{background:var(--mark);color:var(--mark-ink)}
.row-loc{font-weight:700;font-style:italic;color:var(--axis)}
.row-type{margin-top:2px}
.row-param{margin-top:2px;font-weight:600}
.row-meta{margin-top:4px;font-size:14px;color:var(--ink-2)}
.tag{display:inline-block;font-style:normal;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px;vertical-align:1px;margin-left:6px}
.tag.critical{background:var(--mark-soft);color:var(--mark)}
.tag.major{background:var(--warn-soft);color:var(--warn)}
.tag.minor{background:var(--sheet-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* маяки */
.beacon{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--rule);cursor:pointer;align-items:center}
.beacon:first-child{border-top:0}
.beacon:active{background:var(--sheet-2)}
.b-title{font-weight:700}
.b-title small{font-weight:400;color:var(--ink-2);font-size:14px;margin-left:6px}
.b-line{font-size:14px;color:var(--ink-2);grid-column:1}
.spark{grid-row:1 / span 3;grid-column:2}

.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}
.empty h2{color:var(--ink);font-size:19px;margin:0 0 6px}
.empty p{margin:0 0 18px}

/* панели раздела «Объект» */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:17px}
.panel p{margin:6px 0}
.small{font-size:14px}
.muted{color:var(--ink-2)}
.obj-list{display:flex;flex-direction:column;gap:6px}
.obj-item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--rule);
  border-radius:10px;background:var(--sheet);cursor:pointer}
.obj-item.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.obj-item span{color:var(--ink-2);font-size:14px;flex:none}

/* формы */
.field{margin-bottom:14px}
.field>label,.lbl{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
textarea.inp{min-height:76px;resize:vertical}
.hint{font-size:13.5px;color:var(--ink-2);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .field,.grid2 .field{margin-bottom:0}
.group{border-top:1px solid var(--rule);padding-top:14px;margin-top:6px}
.group-title{font-size:15px;font-weight:700;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{padding:8px 12px}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-left:1px solid var(--rule);background:var(--sheet);padding:10px 4px;font-size:14px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.seg button.on.critical{background:var(--mark);color:var(--mark-ink)}
.typebtn{width:100%;text-align:left;font-size:16px;padding:12px;border:1px dashed var(--rule);border-radius:10px;background:var(--sheet-2);cursor:pointer}
.typebtn.set{border-style:solid;background:var(--sheet);font-weight:600}
.typebtn .code{color:var(--ink-2);font-weight:400;margin-right:8px}
.photo-row{display:flex;gap:8px}
.photo-row .inp{flex:1}

/* выбор осей: марки осей как на чертеже */
.ax-prev{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--axis-soft);margin-bottom:10px;min-height:46px}
.ax-prev b{font-style:italic;color:var(--axis);font-size:18px}
.ax-prev .none{color:var(--ink-2);font-size:15px}
.ax-row-lbl{font-size:13.5px;color:var(--ink-2);margin:8px 0 6px}
.ax-grid{display:flex;flex-wrap:wrap;gap:7px}
.ax{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--axis);background:var(--sheet);color:var(--axis);
  font-style:italic;font-weight:650;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ax.long{font-size:12.5px}
.ax.mid{background:var(--axis-soft)}
.ax.on{background:var(--axis);color:var(--sheet)}

/* кнопки */
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.btn.danger{color:var(--mark);border-color:var(--mark-soft)}
.btn.small{font-size:14.5px;padding:9px 12px}
.btn-col{display:flex;flex-direction:column;gap:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--axis);font-size:14.5px;font-weight:600;cursor:pointer;padding:4px}

/* листы (формы поверх) */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--paper);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;border-bottom:1px solid var(--rule);background:var(--paper)}
.sheet-head h2{flex:1;margin:0;font-size:18px;text-align:center}
.icon-btn{width:44px;height:44px;border:0;background:none;font-size:20px;cursor:pointer;border-radius:10px;color:var(--ink-2)}
.sheet-spacer{width:44px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.sheet-body>*{max-width:720px;margin-left:auto;margin-right:auto}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--rule);background:var(--sheet)}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.danger{flex:0 0 auto}

/* список типов */
.tp-grp{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:16px 0 6px}
.tp-item{display:flex;gap:10px;width:100%;text-align:left;padding:12px;border:0;border-top:1px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:16px}
.tp-list .tp-box{border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tp-list .tp-box .tp-item:first-child{border-top:0}
.tp-item .code{color:var(--ink-2);min-width:44px;flex:none}
.tp-custom{margin-top:14px;width:100%}

/* маяк: подробно */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px;font-size:15px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.chart{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;margin-bottom:14px}
.chart .grid line{stroke:var(--rule);stroke-width:1}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--sans)}
.chart .line{fill:none;stroke:var(--mark);stroke-width:2}
.chart .pt{fill:var(--sheet);stroke:var(--mark);stroke-width:2}
.chart .pt.break{fill:var(--mark)}
.spark .line{fill:none;stroke:var(--mark);stroke-width:1.6}
.spark .pt{fill:var(--mark)}
table.readings{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;font-size:15px}
table.readings th,table.readings td{padding:10px;border-top:1px solid var(--rule);text-align:left}
table.readings th{font-size:13.5px;color:var(--ink-2);font-weight:600;border-top:0;background:var(--sheet-2)}
table.readings tbody tr{cursor:pointer}
table.readings td.n{text-align:right}

.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--mark);color:var(--mark-ink)}
body.noscroll .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%) translateY(-10px)}
body.noscroll .toast.show{transform:translateX(-50%)}


/* рабочий экран чертежа */
.plan-hint[hidden]{display:none}
.ink-bar{display:flex;flex-wrap:wrap;gap:6px 10px;width:100%;align-items:center;justify-content:space-between}
.ink-tools,.ink-acts{display:flex;gap:2px;align-items:center}
.ink-acts{flex:1 1 auto;justify-content:flex-end}
.tb{position:relative;width:42px;height:42px;flex:none;border-radius:10px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tb.on{background:var(--ink);color:var(--paper)}
.tb:disabled{opacity:.3;cursor:default}
.tb .dot{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px}
.swatch{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--rule)}
.ink-acts .btn.mark,.ink-acts .btn.axis{flex:0 1 150px;margin-left:6px;padding:10px 12px;white-space:nowrap;font-size:15px}
.ink-acts .btn.axis+.btn.mark{margin-left:4px}
.btn.axis{background:var(--sheet);color:var(--axis);border-color:var(--axis)}
select.inp{appearance:auto}
.pop{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;width:min(380px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;
  background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;box-shadow:0 14px 34px -12px rgba(0,0,0,.45)}
.pop-title{font-weight:700;font-size:15px;margin-bottom:10px}
.pop-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pop-row+.pop-row{margin-top:12px}
.pop .sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);position:relative;display:inline-block}
.pop .sw.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink)}
.pop .sw-any{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.pop .sw-any input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pop .wd{width:48px;height:40px;border-radius:10px;border:2px solid transparent;background:#fff;box-shadow:inset 0 0 0 1px #cdd5da;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#14202a}
.pop .wd.on{border-color:var(--mark);box-shadow:none;background:#fff1f1}
.pop .wd.txt{width:auto;padding:0 12px;font-size:14px;font-weight:600}
.pop .wd i{display:block;border-radius:99px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border:0;border-top:1px solid var(--rule);background:none;text-align:left;font-size:15.5px;line-height:1.3;cursor:pointer;color:var(--ink)}
.menu-item:first-child,.pop-title+.menu-item{border-top:0}
.menu-item input{width:20px;height:20px;accent-color:var(--mark);flex:none}
.menu-item.danger{color:var(--mark)}
.menu-item:disabled{opacity:.4;cursor:default}
/* список чертежей */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dcard{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.dcard-open{display:block;width:100%;padding:0;border:0;border-bottom:1px solid var(--rule);background:#fff;cursor:pointer}
.dcard-open img{display:block;width:100%;aspect-ratio:1.414/1;object-fit:contain;background:#fff}
.dcard-meta{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:8px 4px 8px 12px}
.dcard-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.dcard-sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.empty .btn{margin-top:4px}
/* отметки: панель правки, направления выноски, свой вариант */
.mk-bar{display:flex;flex-wrap:wrap;gap:8px;width:100%;align-items:center}
.mk-bar .btn{flex:1 1 auto;padding:11px 12px}
.mk-bar .btn:disabled{opacity:.4}
.dir-btns{display:flex;gap:4px;flex:0 0 auto}
.dir-btns .tb{border:1px solid var(--rule);font-size:20px;line-height:1;width:40px;height:40px}
.combo{display:flex;gap:8px;align-items:stretch}
.combo .inp{flex:1;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg:empty{display:none}
.chip-add{border-style:dashed;color:var(--axis)}
/* экран объектов */
.olist{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);cursor:pointer;font:inherit;color:var(--ink)}
.ocard:active{background:var(--sheet-2)}
.ocard-name{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.ocard-addr{font-size:14.5px;color:var(--ink-2)}
.ocard-meta{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.top .obj-name{flex:1;min-width:0;font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-btn{flex:none;display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--axis);font:inherit;font-size:16px;font-weight:600;padding:8px 6px 8px 0;cursor:pointer}
body.at-home .tabs{display:none}
body.at-home .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
body.at-home{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tb-txt{font-weight:700;font-size:16px;border:1px solid var(--rule)}
.calc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:-4px 0 14px;font-size:15px;color:var(--ink-2)}
.calc b{color:var(--ink)}
/* «Сведения»: выгрузки одним стилем */
.act-list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.act:first-child{border-top:0}
.act:active{background:var(--sheet-2)}
.act-ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--axis-soft);color:var(--axis);display:flex;align-items:center;justify-content:center}
.act-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act-t b{font-size:16px}
.act-t small{font-size:13.5px;color:var(--ink-2)}
.act-chev{flex:none;font-size:22px;color:var(--ink-2)}
.home-acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.home-acts .btn{flex:1 1 auto}
.notice{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--axis-soft);color:var(--ink);font-size:14.5px}
.inp.err{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark-soft)}
.hdr-done{flex:none;display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.hdr-title{border:0;background:none;color:inherit;font:inherit;font-size:18px;font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px}
.hdr-title:active{background:var(--sheet-2)}
.tedit{max-width:560px}
.tedit textarea{min-height:84px;font-size:17px}
.tedit .wd{width:48px;height:40px;border-radius:10px;border:2px solid transparent;background:#fff;box-shadow:inset 0 0 0 1px #cdd5da;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#14202a;font-size:17px}
.tedit .wd.on{border-color:var(--mark);box-shadow:none;background:#fff1f1}
.tedit .wd.txt{width:auto;padding:0 10px;font-size:14px;font-weight:600}
.tedit .sw{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.tedit .sw.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink)}
.tedit .pop-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tedit .seg button{padding:9px 4px}
/* маяки: вторая ось, фото по циклам */
.chart .line.y{stroke:var(--axis)}
.chart .pt.y{stroke:var(--axis)}
.spark .line.y{stroke:var(--axis)}
.spark .pt.y{fill:var(--axis)}
.cycle{margin:8px 0 12px}
.cycle-h{font-size:14px;color:var(--ink-2);margin-bottom:6px}
/* фото */
.prow{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 14px 10px 10px;border-top:1px solid var(--rule);cursor:pointer;align-items:center}
.prow:first-child{border-top:0}
.prow:active{background:var(--sheet-2)}
.prow-img{width:76px;height:58px;border-radius:8px;overflow:hidden;background:var(--sheet-2);display:block}
.prow-img img{width:100%;height:100%;object-fit:cover;display:block}
.prow-t{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.prow-t .row-no{min-width:auto;padding:0 8px}
.btn.photo{background:var(--sheet);color:#2c7a4b;border-color:#2c7a4b}
.ink-acts .btn.photo{flex:0 1 130px;margin-left:6px;padding:10px 12px;white-space:nowrap;font-size:15px}
.sel-count{align-self:center;font-size:14px;font-weight:600;color:var(--ink-2);padding:0 4px}
/* категория технического состояния */
.kts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kts button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 6px;font:inherit;font-size:14px;line-height:1.25;cursor:pointer;min-height:44px}
.kts button.on{font-weight:600;border-color:transparent}
.kts button.on.k-ok{background:var(--ok);color:var(--paper)}
.kts button.on.k-major{background:var(--warn);color:var(--paper)}
.kts button.on.k-critical{background:var(--mark);color:var(--mark-ink)}
@media (min-width:620px){.kts{grid-template-columns:repeat(4,1fr)}}
.gost{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--sheet-2);font-size:14.5px;line-height:1.45}
.gost-empty p{margin:0 0 10px;color:var(--ink-2)}
.gost-ref{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.gost-name{font-weight:600;margin-bottom:6px}
.gost-note{font-size:13px;color:var(--ink-2);margin-top:6px}
.gost-check{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--sheet);font-size:14px}
.gost-check.fit{background:var(--ok-soft);color:var(--ok)}
.gost-check.nofit{background:var(--warn-soft);color:var(--warn)}
.gost-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gost-done{display:inline-flex;align-items:center;min-height:36px;font-weight:600;color:var(--ink)}
.gost-cause{margin-top:10px;font-size:13px;color:var(--ink-2)}
.gost-cause b{font-weight:600}
.gost-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gp-item .tag{margin-left:8px}
/* серия фото камерой */
.cam{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none}
.cam-view{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
.cam-pv{position:absolute;inset:0;width:100%;height:100%;display:block}
.cam-v{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.on{animation:camflash .28s ease-out}
@keyframes camflash{from{opacity:.7}to{opacity:0}}
.cam-top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:center;pointer-events:none}
.cam-count{background:rgba(0,0,0,.6);padding:7px 14px;border-radius:16px;font-size:15px;font-weight:600;text-align:center;max-width:100%}
.cam-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.cam-thumbs{display:flex;gap:6px;align-items:center;min-height:60px;overflow:hidden}
.cam-th{height:60px;width:auto;border-radius:6px;border:1px solid rgba(255,255,255,.45);flex:none}
.cam-shot{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 3px #000;cursor:pointer;padding:0}
.cam-shot:active{transform:scale(.93)}
.cam-side{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.cam-btn{min-height:48px;min-width:48px;padding:0 16px;border-radius:24px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.cam-done{background:#fff;color:#000;border-color:#fff}
.cam-ico{padding:0;display:inline-flex;align-items:center;justify-content:center}
.cam-btn.on{background:#ffd23f;color:#000;border-color:#ffd23f}
.cam-btn[hidden]{display:none}
@media (max-width:520px){.cam-bar{grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding-left:12px;padding-right:12px}.cam-side{gap:8px}.cam-btn{padding:0 13px}}
button.pic.add{font:inherit;font-weight:600;font-size:14.5px;color:var(--ink-2)}
/* диалоги */
.dlg{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg-box{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 16px 40px -14px rgba(0,0,0,.45)}
.dlg-msg{margin:0 0 16px;font-size:16px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.dlg-box .inp{margin-bottom:16px}
.dlg-btns{display:flex;gap:8px}
.dlg-btns .btn{flex:1}
/* занятость */
.busy{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.busy[hidden]{display:none}
.busy-box{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;display:flex;gap:12px;align-items:center;max-width:80%;box-shadow:0 12px 30px -12px rgba(0,0,0,.35)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--mark);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* фото */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pic{position:relative;aspect-ratio:1/1;min-height:84px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;padding:0;background:var(--sheet-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.add{border-style:dashed;color:var(--ink-2);font-weight:600;font-size:14.5px;text-align:center;line-height:1.2}
.photo-big{width:100%;height:auto;border-radius:10px;display:block;background:var(--sheet-2)}
/* чертёж */
.plan-prev canvas{width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:10px;background:#fff}
.plan-sheet .sheet-body{padding:0;overflow:hidden;position:relative}
.plan-sheet .sheet-body>*{max-width:none}
.plan-wrap{position:absolute;inset:0;background:var(--sheet-2);overflow:hidden}
.plan-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.plan-hint{position:absolute;left:12px;right:12px;top:10px;font-size:13.5px;line-height:1.35;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;color:var(--ink-2);pointer-events:none;text-align:center}
.plan-foot{display:flex;flex-wrap:wrap;gap:8px;width:100%;align-items:stretch}
.plan-foot .seg{flex:1 1 100%}
.plan-foot .seg button{padding:8px 4px}
.plan-foot .btn{flex:1}
.plan-foot .btn:disabled{opacity:.45}
.dr-list .dr{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.dr-list .dr:first-child{border-top:0;padding-top:0}
.dr img{width:84px;height:60px;object-fit:contain;background:#fff;border:1px solid var(--rule);border-radius:6px;display:block}
.dr-name{font-weight:600;margin-bottom:6px;overflow-wrap:anywhere}
.filters-lbl{flex:none;align-self:center;font-size:14px;color:var(--ink-2);margin-right:2px}
.check{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--rule);font-size:16px;cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--mark);flex:none}
@media (min-width:600px){ .grid3{grid-template-columns:repeat(5,1fr)} }
</style>

const MEDIA = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('polevoy-zhurnal-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('m');
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbp = null; rej(r.error || new Error('хранилище недоступно')); };
    });
    return dbp;
  }
  async function tx(mode, fn){
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('m', mode); let out;
      const r = fn(t.objectStore('m')); if(r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('запись прервана — возможно, не хватает места'));
    });
  }
  return {
    async put(id, blob){ const buf = await blob.arrayBuffer(); return tx('readwrite', st => st.put({type: blob.type || 'image/jpeg', buf}, id)); },
    async get(id){ const v = await tx('readonly', st => st.get(id)); return v ? new Blob([v.buf], {type: v.type}) : null; },
    async del(id){ dropURL(id); return tx('readwrite', st => st.delete(id)); },
    keys(){ return tx('readonly', st => st.getAllKeys()); }
  };
})();
const urlCache = new Map();
async function mediaURL(id){
  if(urlCache.has(id)) return urlCache.get(id);
  const b = await MEDIA.get(id); if(!b) return null;
  const u = await objURL(b); urlCache.set(id, u); return u;
}
function dropURL(id){ const u = urlCache.get(id); if(u){ URL.revokeObjectURL(u); urlCache.delete(id); } }
function mediaIds(objs){
  const s = new Set();
  for(const o of objs){
    for(const d of o.drawings || []){ s.add(d.id); if(d.thumb) s.add(d.thumb); if(d.ink) s.add(d.ink); if(d.src) s.add(d.src); }
    for(const d of o.defects || []) for(const p of d.pics || []) s.add(p.id);
    for(const ph of o.photos || []) for(const p of ph.pics || []) s.add(p.id);
    for(const b of o.beacons || []){
      for(const p of b.pics || []) s.add(p.id);
      for(const r of b.readings || []) for(const p of r.pics || []) s.add(p.id);
    }
  }
  return s;
}

let blobImgOK = null;
function probeBlobImages(){
  if(blobImgOK) return blobImgOK;
  blobImgOK = new Promise(res => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 2;
      c.toBlob(b => {
        if(!b) return res(false);
        const u = URL.createObjectURL(b), im = new Image(), t = setTimeout(() => res(false), 3000);
        im.onload = () => { clearTimeout(t); URL.revokeObjectURL(u); res(true); };
        im.onerror = () => { clearTimeout(t); URL.revokeObjectURL(u); res(false); };
        im.src = u;
      }, 'image/png');
    } catch(e) { res(false); }
  });
  return blobImgOK;
}
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function objURL(blob){ return (await probeBlobImages()) ? URL.createObjectURL(blob) : blobToDataURL(blob); }
async function loadImage(blob){
  const u = await objURL(blob);
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res({img: im, url: u, w: im.naturalWidth, h: im.naturalHeight});
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('не удалось открыть изображение')); };
    im.src = u;
  });
}
function canvasBlob(c, type, q){ return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('не удалось сжать изображение')), type, q)); }
async function resizeToJpeg(src, w, h, maxSide, quality, maxArea){
  const k = Math.min(1, maxSide / Math.max(w, h), maxArea ? Math.sqrt(maxArea / (w * h)) : 1);
  const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cw, ch); x.imageSmoothingQuality = 'high';
  x.drawImage(src, 0, 0, cw, ch);
  const blob = await canvasBlob(c, 'image/jpeg', quality);
  c.width = c.height = 0;
  return {blob, w: cw, h: ch};
}
async function savePhoto(file){
  const im = await loadImage(file);
  try {
    const r = await resizeToJpeg(im.img, im.w, im.h, 1600, 0.82);
    const id = uid(); await MEDIA.put(id, r.blob);
    return {id, w: r.w, h: r.h};
  } finally { URL.revokeObjectURL(im.url); }
}
const imgCache = new Map();
function drawingImage(id){
  if(!imgCache.has(id)){
    const p = MEDIA.get(id).then(b => { if(!b) throw new Error('файл чертежа не найден'); return loadImage(b); });
    imgCache.set(id, p); p.catch(() => imgCache.delete(id));
    while(imgCache.size > 3){
      const k = imgCache.keys().next().value; const old = imgCache.get(k); imgCache.delete(k);
      old.then(r => URL.revokeObjectURL(r.url)).catch(() => {});
    }
  }
  return imgCache.get(id);
}

/* ===================== Чертежи: загрузка ===================== */
const A_MM = [[841, 1189], [594, 841], [420, 594], [297, 420], [210, 297]]; // А0…А4, короткая и длинная стороны
function paperName(wmm, hmm){
  const S = Math.min(wmm, hmm), L = Math.max(wmm, hmm), near = (a, b) => Math.abs(a - b) <= Math.max(3, b * 0.015);
  for(let k = 0; k < 5; k++){ const [sh, lo] = A_MM[k]; if(near(S, sh) && near(L, lo)) return `А${k}`; }
  for(let k = 1; k < 5; k++){ const [sh, lo] = A_MM[k]; for(let n = 2; n <= 9; n++){ const m = sh * n; if((near(S, lo) && near(L, m)) || (near(L, lo) && near(S, m))) return `А${k}×${n}`; } }
  return '';
}
function pageMM(dr){
  if(dr.pw && dr.ph) return [dr.pw * 25.4 / 72, dr.ph * 25.4 / 72];
  const k = Math.max(0, Math.min(4, parseInt(String(dr.fmt || 'A3').slice(1), 10) || 3)), [sh, lo] = A_MM[k];
  return dr.w >= dr.h ? [lo, sh] : [sh, lo];
}
function fmtLabel(dr){ const [w, hh] = pageMM(dr), n = paperName(w, hh); return (n ? n + ', ' : '') + `${Math.round(w)}×${Math.round(hh)} мм`; }
function baseName(n){ return String(n || 'Чертёж').replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim() || 'Чертёж'; }
function parsePages(str, n){
  const out = new Set();
  for(const t of String(str || '').replace(/\s*[-–—]\s*/g, '-').split(/[,;\s]+/).filter(Boolean)){
    const m = t.match(/^(\d+)-(\d+)$/);
    if(m){ let a = +m[1], b = +m[2]; if(a > b) [a, b] = [b, a]; for(let i = Math.max(1, a); i <= Math.min(n, b); i++) out.add(i); }
    else if(/^\d+$/.test(t) && +t >= 1 && +t <= n) out.add(+t);
  }
  return [...out].sort((a, b) => a - b);
}
async function addDrawing(o, name, src, w, h, extra){
  const big = await resizeToJpeg(src, w, h, 4200, 0.86, 12e6);
  const th = await resizeToJpeg(src, w, h, 360, 0.75);
  const id = uid(), thumb = uid();
  await MEDIA.put(id, big.blob); await MEDIA.put(thumb, th.blob);
  o.drawings.push({id, thumb, name, w: big.w, h: big.h, added: Date.now(), ...(extra || {})});
  save();
}
async function importDrawingFiles(files){
  const o = cur(); if(!o) return 0;
  let added = 0;
  try {
    for(const file of files){
      if(file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) added += await importPdf(o, file);
      else {
        busy('Загружаю чертёж…');
        const im = await loadImage(file);
        try { await addDrawing(o, baseName(file.name), im.img, im.w, im.h); added++; }
        finally { URL.revokeObjectURL(im.url); }
      }
    }
  } catch(e) { toast('Чертёж не загрузился: ' + e.message, true); }
  busy(null); render();
  if(added) toast(`Добавлено: ${plural(added, ['чертёж','чертежа','чертежей'])}`);
  return added;
}
async function importPdf(o, file){
  busy('Открываю PDF…');
  try { await loadScript(BUILD.pdfWorker); await loadScript(BUILD.pdf); }
  catch(e) { throw new Error('модуль чтения PDF не загрузился. Для загрузки PDF нужен интернет; изображения (JPG, PNG) загружаются и без него'); }
  const pdf = await window.pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false}).promise;
  let pages = [1];
  if(pdf.numPages > 1){
    busy(null);
    const ans = await askText(`В файле ${plural(pdf.numPages, ['лист','листа','листов'])}. Какие загрузить? Например: 1, 3-4`, pdf.numPages <= 4 ? `1-${pdf.numPages}` : '1');
    if(ans === null){ pdf.destroy(); return 0; }
    pages = parsePages(ans, pdf.numPages);
    if(!pages.length){ pdf.destroy(); throw new Error('не указаны листы'); }
  }
  let n = 0;
  const srcId = uid();
  await MEDIA.put(srcId, new Blob([await file.arrayBuffer()], {type: 'application/pdf'}));
  for(const p of pages){
    busy(`Рисую лист ${p}${pages.length > 1 ? ` (${n + 1} из ${pages.length})` : ''}…`);
    const page = await pdf.getPage(p);
    const v1 = page.getViewport({scale: 1});
    const k = Math.min(4200 / Math.max(v1.width, v1.height), Math.sqrt(12e6 / (v1.width * v1.height)));
    const vp = page.getViewport({scale: k});
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: x, viewport: vp}).promise;
    await addDrawing(o, baseName(file.name) + (pdf.numPages > 1 ? ` — лист ${p}` : ''), c, c.width, c.height,
      {src: srcId, page: p, pw: Math.round(v1.width * 100) / 100, ph: Math.round(v1.height * 100) / 100});
    c.width = c.height = 0; page.cleanup(); n++;
  }
  pdf.destroy();
  if(!n) await MEDIA.del(srcId).catch(() => {});
  return n;
}

/* ===================== Отметки на чертеже: геометрия и отрисовка ===================== */
function bboxN(marks){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(const m of marks || []){
    for(const [x, y] of m.p){ x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    if(m.lab){ x0 = Math.min(x0, m.lab[0]); y0 = Math.min(y0, m.lab[1]); x1 = Math.max(x1, m.lab[0]); y1 = Math.max(y1, m.lab[1]); }
  }
  return x0 === Infinity ? null : {x0, y0, x1, y1};
}

function bboxPts(pts){ const b = bboxN([{p: pts}]); return b || {x0: 0, y0: 0, x1: 0, y1: 0}; }
function rdp(pts, eps){
  if(pts.length < 3) return pts;
  const [ax, ay] = pts[0], [bx, by] = pts[pts.length - 1], dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
  let dmax = 0, idx = 0;
  for(let i = 1; i < pts.length - 1; i++){
    const d = len < 1e-6 ? Math.hypot(pts[i][0] - ax, pts[i][1] - ay) : Math.abs(dy * pts[i][0] - dx * pts[i][1] + bx * ay - by * ax) / len;
    if(d > dmax){ dmax = d; idx = i; }
  }
  if(dmax > eps){ const l = rdp(pts.slice(0, idx + 1), eps), r = rdp(pts.slice(idx), eps); return l.slice(0, -1).concat(r); }
  return [pts[0], pts[pts.length - 1]];
}
function pointInPoly(x, y, pts){
  let inside = false;
  for(let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function distSeg(px, py, [ax, ay], [bx, by]){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function distPolyline(px, py, pts, closed){
  let d = Infinity;
  for(let i = 1; i < pts.length; i++) d = Math.min(d, distSeg(px, py, pts[i - 1], pts[i]));
  if(closed && pts.length > 2) d = Math.min(d, distSeg(px, py, pts[pts.length - 1], pts[0]));
  return d;
}
function styleFor(kind, o = {}){
  const k = o.scale || 1;
  const base = kind === 'beacon' ? {color: COL.axis, fill: COL.axisFill} : {color: COL.mark, fill: COL.markFill};
  return {...base, alpha: o.faint ? 0.5 : 1, w: (o.strong ? 3 : 2) * k, r: (o.strong ? 8 : 6) * k, fs: 13 * k, labelBg: '#ffffff', bounds: o.bounds};
}
function pill(ctx, x, y, w, hh){
  const r = hh / 2; ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2); ctx.lineTo(x + r, y + hh);
  ctx.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5); ctx.closePath();
}
function drawMarks(ctx, marks, map, st, label){
  if(!marks || !marks.length) return null;
  ctx.save(); ctx.globalAlpha = st.alpha ?? 1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const ext = (x, y) => { if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; };
  for(const m of marks){
    const pts = m.p.map(map);
    ctx.beginPath();
    if(m.t === 'p'){
      const [x, y] = pts[0];
      ctx.arc(x, y, st.r, 0, Math.PI * 2); ctx.fillStyle = st.fill; ctx.fill();
      ctx.lineWidth = st.w; ctx.strokeStyle = st.color; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, Math.max(1.5, st.r * 0.28), 0, Math.PI * 2); ctx.fillStyle = st.color; ctx.fill();
      ext(x - st.r, y - st.r); ext(x + st.r, y + st.r); continue;
    }
    pts.forEach(([x, y], i) => { i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); ext(x, y); });
    if(m.t === 'a'){ ctx.closePath(); ctx.fillStyle = st.fill; ctx.fill(); ctx.lineWidth = st.w; }
    else ctx.lineWidth = st.w * 1.5;
    ctx.strokeStyle = st.color; ctx.stroke();
  }
  let lab = null;
  if(label){
    ctx.font = `700 ${st.fs}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
    const tw = ctx.measureText(label).width, lh = st.fs * 1.6, lw = Math.max(lh, tw + st.fs * 0.9);
    let lx = x1 + st.fs * 0.25, ly = y0 - lh - st.fs * 0.15;
    if(st.bounds){ lx = Math.min(lx, st.bounds.w - lw - 2); ly = Math.max(2, Math.min(ly, st.bounds.h - lh - 2)); lx = Math.max(2, lx); }
    pill(ctx, lx, ly, lw, lh); ctx.fillStyle = st.labelBg; ctx.fill();
    ctx.lineWidth = Math.max(1.5, st.w * 0.7); ctx.strokeStyle = st.color; ctx.stroke();
    ctx.fillStyle = st.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + lw / 2, ly + lh / 2 + st.fs * 0.06);
    lab = {x: lx, y: ly, w: lw, h: lh};
  }
  ctx.restore();
  return lab;
}
// Отметки на листе. Записи с общим plan.g — одна отметка, номера через «;» (3;4;10)
const beaconNumKey = s => { const t = lastNumTok(s); return t ? +t : 0; };
const KIND_LIST = {defect: 'defects', beacon: 'beacons', photo: 'photos'};
function itemLabel(kind, r){ return kind === 'beacon' ? r.num : kind === 'photo' ? 'Ф-' + r.no : String(r.no); }

function planItems(o, drId){

function markPrims(m, kind, label, dr, M, alpha, withLabel, color){

  for(const [x, y] of pts){ by0 = Math.min(by0, y); bx1 = Math.max(bx1, x); }

function itemPrims(kind, marks, label, dr, opts = {}){

      pg.drawText(str, {x: p.x * k - (p.align === 'center' ? w / 2 : 0), y: H - p.y * k, size, font, color: hexRgb(L, p.color), opacity: a});
    }
  }
}


async function buildSheetsPdfVector(L, o, drs, opt){
  const out = await L.PDFDocument.create(), srcCache = new Map(), cx = out.context;
  const SF = L.StandardFonts, fonts = {};
  for(const [k, f] of [['reg', SF.Helvetica], ['it', SF.HelveticaOblique], ['bold', SF.HelveticaBold], ['bi', SF.HelveticaBoldOblique], ['sreg', SF.TimesRoman], ['sit', SF.TimesRomanItalic], ['sbold', SF.TimesRomanBold], ['sbi', SF.TimesRomanBoldItalic]]) fonts[k] = await out.embedFont(f);
  const OCG = {}, order = [];
  const ocg = (tag, name) => { if(!OCG[tag]){ OCG[tag] = cx.register(cx.obj({Type: 'OCG', Name: L.PDFHexString.fromText(name)})); order.push(OCG[tag]); } return OCG[tag]; };
  let i = 0;
  for(const dr of drs){
    busy(`PDF: лист ${++i} из ${drs.length}…`);
    const [wmm, hmm] = pageMM(dr), Wd = wmm * 72 / 25.4, Hd = hmm * 72 / 25.4;
    let pg, cm;
    if(dr.src && !opt.bare){
      let sd = srcCache.get(dr.src);
      if(!sd){
        const b = await MEDIA.get(dr.src); if(!b) throw new Error('исходный PDF листа не найден');
        sd = await L.PDFDocument.load(await b.arrayBuffer(), {ignoreEncryption: true}); srcCache.set(dr.src, sd);
      }
      [pg] = await out.copyPages(sd, [dr.page - 1]); out.addPage(pg);
      cm = displayCm(pg);
    } else {
      pg = out.addPage([Wd, Hd]); cm = {m: [1, 0, 0, 1, 0, 0], W: Wd, H: Hd};
      if(!opt.bare){
        const jb = await MEDIA.get(dr.id); if(!jb) throw new Error('изображение листа не найдено');
        pg.drawImage(await out.embedJpg(new Uint8Array(await jb.arrayBuffer())), {x: 0, y: 0, width: Wd, height: Hd});
      }
    }
    const k = cm.W / dr.w, H = cm.H;
    const res = pg.node.normalizedEntries().Resources;
    let props = res.lookupMaybe(L.PDFName.of('Properties'), L.PDFDict);
    if(!props){ props = cx.obj({}); res.set(L.PDFName.of('Properties'), props); }
    const layer = (tag, name, draw) => {
      props.set(L.PDFName.of(tag), ocg(tag, name));
      pg.pushOperators(L.pushGraphicsState(), L.concatTransformationMatrix(...cm.m),
        L.PDFOperator.of(L.PDFOperatorNames.BeginMarkedContentSequence, [L.PDFName.of('OC'), L.PDFName.of(tag)]));
      draw();
      pg.pushOperators(L.endMarkedContent(), L.popGraphicsState());
    };
    if(opt.notes){
      const ink = await loadInk(dr);
      if(ink.length){
        const vec = [], rasterTexts = [];
        for(const st of ink){ const pr = inkVecPrims(st); if(pr) vec.push(...pr); else rasterTexts.push(st); }
        let png = null;
        if(rasterTexts.length){
          const f = Math.min(1, Math.sqrt(12e6 / (dr.w * dr.h))), c = document.createElement('canvas');
          c.width = Math.round(dr.w * f); c.height = Math.round(dr.h * f);
          const x = c.getContext('2d'); x.setTransform(f, 0, 0, f, 0, 0); drawInk(x, rasterTexts);
          png = await out.embedPng(new Uint8Array(await (await canvasBlob(c, 'image/png')).arrayBuffer()));
          c.width = c.height = 0;
        }
        layer('OCnotes', 'Полевые записи', () => {
          pg.pushOperators(L.setLineJoin(L.LineJoinStyle.Round));
          pdfPrims(L, pg, vec, k, H, fonts);
          if(png) pg.drawImage(png, {x: 0, y: 0, width: cm.W, height: cm.H});
        });
      }
    }
    const items = planItems(o, dr.id);
    for(const [kind, tag, name, on] of [['defect', 'OCdef', 'Дефекты', opt.defects], ['beacon', 'OCbeac', 'Маяки', opt.beacons], ['photo', 'OCphoto', 'Фото', opt.photos]]){
      const its = items.filter(it => it.kind === kind);
      if(!on || !its.length) continue;
      layer(tag, name, () => { for(const it of its) pdfPrims(L, pg, itemPrims(it.kind, it.ref.plan.m, it.label, dr, {color: markColor(it.kind, it.ref)}), k, H, fonts); });
    }
  }
  if(order.length) out.catalog.set(L.PDFName.of('OCProperties'), cx.obj({OCGs: order, D: {Order: order, ON: order, BaseState: 'ON'}}));
  busy('PDF: упаковка…');
  return out.save();
}

async function buildSheetsPdfRaster(o, drs, opt){
  const pages = []; let i = 0;
  for(const dr of drs){
    busy(`PDF: лист ${++i} из ${drs.length}…`);
    const c = await renderMap(dr, o, 4200, opt.notes ? await loadInk(dr) : null, {defects: opt.defects, beacons: opt.beacons, photos: opt.photos});
    const [wmm, hmm] = pageMM(dr);
    pages.push({jpg: await canvasU8(c, 0.9), w: c.width, h: c.height, pw: wmm * 72 / 25.4, ph: hmm * 72 / 25.4});
    c.width = c.height = 0;
  }
  busy('PDF: упаковка…');
  return pdfFromJpegs(pages);
}

async function exportSheetsPdf(drs, opt){
  const o = cur(); if(!o || !drs.length) return;
  let u8 = null, note = '';
  try {
    busy('Готовлю PDF…');
    let L = null;
    try { if(!window.PDFLib) await loadScript(BUILD.pdflib); L = window.PDFLib || null; } catch(e) { L = null; }
    if(L){ try { u8 = await buildSheetsPdfVector(L, o, drs, opt); } catch(e) { note = e.message; u8 = null; } }

    offerFile(drs.length === 1 ? `${safeName(drs[0].name)} — ${suffix} ${today()}.pdf` : `Чертежи_${safeName(o.name)}_${suffix}_${today()}.pdf`, u8, 'application/pdf', {replace: true});
  } catch(e) { busy(null); toast('PDF не сформировался: ' + e.message, true); }
}

/* ===================== Оси ===================== */
function fixLetters(s){ return String(s).toUpperCase().replace(/[ABCEHKMPTXY]/g, c => LAT2CYR[c] || c); }
function axisParts(a, kind){
  const [b, s] = String(a).split('/');
  let base;
  if(kind === 'n'){ base = parseFloat(b); if(isNaN(base)) base = 1e6; }
  else { const i = LET.indexOf(b); base = i >= 0 ? i : 1000 + (b.charCodeAt(0) || 0); }
  return [base, s === undefined ? -1 : (parseFloat(s) || 0)];
}
function cmpAxis(x, y, kind){
  const [a1, b1] = axisParts(x, kind), [a2, b2] = axisParts(y, kind);
  return a1 - a2 || b1 - b2 || String(x).localeCompare(String(y));
}
function parseAxes(str, kind){
  let s = String(str || '').replace(/\s*[-–—]\s*/g, '-');
  if(kind === 'l') s = fixLetters(s);
  const out = [];
  for(const t of s.split(/[,;\s]+/).filter(Boolean)){
    const m = t.match(/^([^-]+)-([^-]+)$/);
    if(m){
      const a = m[1], b = m[2];
      if(kind === 'n' && /^\d+$/.test(a) && /^\d+$/.test(b)){
        let i = +a, j = +b; if(i > j) [i, j] = [j, i];
        if(j - i <= 300){ for(let k = i; k <= j; k++) out.push(String(k)); continue; }
      }
      if(kind === 'l'){
        const i = LET.indexOf(a), j = LET.indexOf(b);
        if(i >= 0 && j >= 0){ for(let k = Math.min(i, j); k <= Math.max(i, j); k++) out.push(LET[k]); continue; }
      }
    }
    out.push(t);
  }
  return [...new Set(out)].sort((x, y) => cmpAxis(x, y, kind));
}
function rangeStr(r){ if(!r || !r.length) return ''; if(r.length === 1 || r[0] === r[1]) return r[0]; return r[0] + '-' + r[1]; }
function axesStr(ax){
  const n = rangeStr(ax && ax.n), l = rangeStr(ax && ax.l);
  if(n && l) return `В/о ${n}//${l}`;
  if(n) return `В/о ${n}`;
  if(l) return `В/о ${l}`;
  return '';
}
function axesOf(item){ return String(item.axesText || '').trim() || axesStr(item.axes); }
function locStr(item){ return [axesOf(item), item.locText].filter(Boolean).join(', '); }
function paramsText(d){
  const p = [];
  if(ptypeOf(d) === 'crack'){
    if(d.w) p.push(`ширина раскрытия ${d.w} мм`); if(d.depth) p.push(`глубина распространения ${d.depth} мм`); if(d.len) p.push(`длина ${d.len} мм`);
  } else {
    const {S, V} = calcSV(d);
    if(d.len) p.push(`длина ${d.len} мм`); if(d.wid) p.push(`ширина ${d.wid} мм`); if(d.depth) p.push(`глубина ${d.depth} мм`);
    if(S !== null) p.push(`площадь ${fmtSig(S)} м²`); else if(d.area) p.push(`площадь ${d.area} м²`);
    if(V !== null) p.push(`объём ${fmtSig(V)} м³`);
  }
  if(d.qty) p.push(`количество ${d.qty} шт.`);
  const s = p.join(', ');
  return s ? s[0].toUpperCase() + s.slice(1) : '';
}



function mountAxisPicker(box, f, o, onChange){
  const ax = f.axes, axN = parseAxes(o.axesN, 'n'), axL = parseAxes(o.axesL, 'l');
  function chips(list, kind){
    const sel = ax[kind] || [], idx = sel.map(a => list.indexOf(a));
    let lo = -1, hi = -1;
    if(idx.length === 2 && idx[0] >= 0 && idx[1] >= 0){ lo = Math.min(...idx); hi = Math.max(...idx); }
    return list.map((a, i) => {
      let c = 'ax' + (a.length > 2 ? ' long' : '');
      if(sel.includes(a)) c += ' on'; else if(i > lo && i < hi) c += ' mid';
      return `<button type="button" class="${c}" data-k="${kind}" data-a="${esc(a)}" aria-pressed="${sel.includes(a)}">${esc(a)}</button>`;
    }).join('');
  }
  function prev(){
    const s = axesOf(f), manual = String(f.axesText || '').trim();
    $('.ax-prev', box).innerHTML = s ? `<b>${esc(s)}</b>${manual ? '<span class="small muted">вписано вручную</span>' : '<button type="button" class="link" data-clear>Сбросить</button>'}` : '<span class="none">Нажмите одну ось или две — получится диапазон</span>';
  }
  function draw(){
    box.innerHTML = `
      <div class="ax-prev"></div>
      ${axN.length ? `<div class="ax-row-lbl">Цифровые оси</div><div class="ax-grid">${chips(axN, 'n')}</div>` : ''}
      ${axL.length ? `<div class="ax-row-lbl">Буквенные оси</div><div class="ax-grid">${chips(axL, 'l')}</div>` : ''}
      ${!axN.length && !axL.length ? '<p class="hint">Оси объекта не заданы. Укажите их в разделе «Сведения» или впишите вручную.</p>' : ''}
      <input class="inp" data-axtext value="${esc(f.axesText || '')}" placeholder="Или впишите вручную: В/о 20-22//А/2-Г" autocomplete="off" style="margin-top:10px">`;
    prev();
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-clear')){ ax.n = []; ax.l = []; draw(); onChange(); return; }
    const k = b.dataset.k, a = b.dataset.a; if(!k) return;
    let s = ax[k] || [];
    if(s.length === 0) s = [a];
    else if(s.length === 1) s = s[0] === a ? [] : [s[0], a].sort((x, y) => cmpAxis(x, y, k));
    else s = [a];
    ax[k] = s;
    const ti = $('[data-axtext]', box); const keep = ti ? ti.value : '';
    draw(); const t2 = $('[data-axtext]', box); if(t2) t2.value = keep;
    onChange();
  });
  box.addEventListener('input', e => { if(e.target.hasAttribute('data-axtext')){ f.axesText = e.target.value; prev(); onChange(); } });
  draw();
}


/* ===================== Листы (окна поверх) ===================== */
const stack = []; let skipPop = 0, flushTimer = 0;
// Запись в истории для каждого окна — чтобы «Назад» на телефоне закрывало окно, а не приложение.
// Если предыдущий шаг «назад» ещё не завершился, новая запись откладывается до его завершения.
function pushEntry(){ if(FRAMED) return false; try { history.pushState({sheet: stack.length}, ''); return true; } catch(e) { return false; } }
function flushPending(){
  clearTimeout(flushTimer);
  for(const n of stack) if(n.pushed === 'pending') n.pushed = pushEntry();
}
function openSheet(title, body, foot, opts = {}){
  const node = h(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button><h2>${esc(title)}</h2><span class="sheet-spacer"></span></div>
    <div class="sheet-body"></div><div class="sheet-foot"></div></div>`);
  if(opts.cls) node.classList.add(opts.cls);
  node.querySelector('.sheet-body').append(body);
  if(foot) node.querySelector('.sheet-foot').append(...(Array.isArray(foot) ? foot : [foot]));
  else node.querySelector('.sheet-foot').remove();
  node.querySelector('[data-close]').onclick = requestClose;
  node.trackDirty = !!opts.trackDirty; node.dirty = false;
  if(node.trackDirty) node.addEventListener('input', () => { node.dirty = true; });
  if(opts.replace && stack.length){
    const old = stack.pop(); old.remove(); node.pushed = old.pushed;
    if(old.onClose) try { old.onClose(); } catch(e) {}
    document.body.append(node); stack.push(node);
  } else {
    document.body.append(node); stack.push(node);
    if(skipPop > 0){ node.pushed = 'pending'; clearTimeout(flushTimer); flushTimer = setTimeout(() => { skipPop = 0; flushPending(); }, 800); }
    else node.pushed = pushEntry();
  }
  document.body.classList.add('noscroll');
  return node;
}
function closeTop(viaPop, count = 1){
  let pushed = 0;
  for(let i = 0; i < count; i++){
    const node = stack.pop(); if(!node) break;
    node.remove(); if(node.pushed === true) pushed++;
    if(node.onClose) try { node.onClose(); } catch(e) {}
  }
  if(!stack.length) document.body.classList.remove('noscroll');
  if(!viaPop && pushed){ skipPop++; try { history.go(-pushed); } catch(e) { skipPop--; } }
}
const DISCARD = 'Закрыть без сохранения? Введённое пропадёт.';
async function requestClose(){
  const node = stack[stack.length - 1];
  if(node && node.beforeClose && node.beforeClose()) return;
  if(node && node.dirty && !(await ask(DISCARD, {ok: 'Закрыть', danger: true}))) return;
  if(stack[stack.length - 1] === node) closeTop(false);
}
window.addEventListener('popstate', async () => {
  if(skipPop > 0){ skipPop--; if(!skipPop) flushPending(); return; }
  const node = stack[stack.length - 1]; if(!node) return;
  if(node.dirty){
    node.pushed = pushEntry();
    if(await ask(DISCARD, {ok: 'Закрыть', danger: true}) && stack[stack.length - 1] === node) closeTop(false);
    return;
  }
  closeTop(true);
});
function btn(label, cls, onClick){ const b = h(`<button type="button" class="btn ${cls || ''}">${esc(label)}</button>`); b.onclick = onClick; return b; }

function mountPlanField(box, f, o, dirty, self){
  async function draw(){
    const ds = o.drawings;

async function createBlankSheet(o, opt, name){
  const [sh, lo] = A_MM[opt.k], wmm = opt.land ? lo : sh, hmm = opt.land ? sh : lo;
  const PT = 72 / 25.4, pw = Math.round(wmm * PT * 100) / 100, ph = Math.round(hmm * PT * 100) / 100;
  const ar = opt.frame ? {x0: 20, y0: 5, x1: wmm - 5, y1: hmm - 5} : {x0: 0, y0: 0, x1: wmm, y1: hmm};
  const lines = []; // в мм от левого верхнего угла
  if(opt.grid){
    const g = opt.grid, nx = Math.floor((ar.x1 - ar.x0) / g - 1e-6), ny = Math.floor((ar.y1 - ar.y0) / g - 1e-6);
    for(let i = 1; i <= nx; i++) lines.push({x0: ar.x0 + i * g, y0: ar.y0, x1: ar.x0 + i * g, y1: ar.y1, major: (i * g) % 50 === 0});
    for(let i = 1; i <= ny; i++) lines.push({x0: ar.x0, y0: ar.y0 + i * g, x1: ar.x1, y1: ar.y0 + i * g, major: (i * g) % 50 === 0});
  }
  const MINOR = [211, 222, 230], MAJOR = [160, 184, 202];
  // изображение листа для экрана
  const k = Math.min(4200 / Math.max(pw, ph), Math.sqrt(12e6 / (pw * ph))), W = Math.floor(pw * k), H = Math.floor(ph * k), px = k * PT;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  for(const major of [false, true]){
    const col = major ? MAJOR : MINOR; x.strokeStyle = `rgb(${col.join(',')})`; x.lineWidth = Math.max(1, (major ? 0.3 : 0.18) * px);
    x.beginPath();
    for(const ln of lines) if(ln.major === major){ x.moveTo(ln.x0 * px, ln.y0 * px); x.lineTo(ln.x1 * px, ln.y1 * px); }
    x.stroke();
  }
  if(opt.frame){ x.strokeStyle = '#000'; x.lineWidth = Math.max(1.5, 0.5 * px); x.strokeRect(ar.x0 * px, ar.y0 * px, (ar.x1 - ar.x0) * px, (ar.y1 - ar.y0) * px); }
  // исходный PDF нужного формата — для выгрузки листа в точном размере и вектором
  let extra = {fmt: 'A' + opt.k, blank: true};
  try {
    if(!window.PDFLib) await loadScript(BUILD.pdflib);
    const L = window.PDFLib, doc = await L.PDFDocument.create(), pg = doc.addPage([pw, ph]), P = v => v * PT, rgb = a => L.rgb(a[0] / 255, a[1] / 255, a[2] / 255);
    for(const ln of lines) pg.drawLine({start: {x: P(ln.x0), y: ph - P(ln.y0)}, end: {x: P(ln.x1), y: ph - P(ln.y1)}, thickness: P(ln.major ? 0.3 : 0.18), color: rgb(ln.major ? MAJOR : MINOR)});
    if(opt.frame) pg.drawRectangle({x: P(ar.x0), y: ph - P(ar.y1), width: P(ar.x1 - ar.x0), height: P(ar.y1 - ar.y0), borderWidth: P(0.5), borderColor: L.rgb(0, 0, 0)});
    doc.setTitle(name); doc.setCreator('Полевой журнал обследования');
    const srcId = uid(); await MEDIA.put(srcId, new Blob([await doc.save()], {type: 'application/pdf'}));
    extra = {src: srcId, page: 1, pw, ph, blank: true};
  } catch(e) { /* без исходного PDF лист всё равно выгрузится в формате А${opt.k} */ }
  await addDrawing(o, name, c, W, H, extra);
  c.width = c.height = 0;
  return o.drawings[o.drawings.length - 1];
}

/* ===================== Серия фото камерой ===================== */
function cameraSeries(onShot, onDone){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Камера в приложении недоступна в этом браузере — используйте «+ Фото»', true); return; }

  const ov = h(`<div class="cam" role="dialog" aria-modal="true" aria-label="Серия фото">
    <div class="cam-view"><canvas class="cam-pv"></canvas><video class="cam-v" playsinline webkit-playsinline muted autoplay></video></div>
    <div class="cam-flash"></div>
    <div class="cam-top"><span class="cam-count" data-cc>Наведите камеру и нажимайте кнопку — каждый снимок сразу добавляется</span></div>
    <div class="cam-bar">
      <div class="cam-thumbs" data-th></div>
      <button type="button" class="cam-shot" data-shot aria-label="Снять"></button>
      <div class="cam-side"><button type="button" class="cam-btn cam-ico" data-torch hidden aria-label="Подсветка" aria-pressed="false" title="Подсветка"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z"/></svg></button><button type="button" class="cam-btn" data-flip aria-label="Сменить камеру" title="Сменить камеру">⟲</button><button type="button" class="cam-btn cam-done" data-done>Готово</button></div>
    </div></div>`);
  document.body.append(ov);
  const v = $('video', ov), cc = $('[data-cc]', ov), th = $('[data-th]', ov), flash = $('.cam-flash', ov), pv = $('.cam-pv', ov), pvx = pv.getContext('2d');
  const stop = () => { if(stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  // подсветка: светодиод камеры горит постоянно, пока открыта съёмка (настоящая вспышка из браузера недоступна)
  const tb = $('[data-torch]', ov); let torchOn = false;
  function drawTorch(){ tb.classList.toggle('on', torchOn); tb.setAttribute('aria-pressed', torchOn); tb.title = torchOn ? 'Выключить подсветку' : 'Включить подсветку'; }
  function checkTorch(){
    torchOn = false; drawTorch();
    const tr = stream && stream.getVideoTracks()[0];
    let caps = {}; try { caps = tr && tr.getCapabilities ? tr.getCapabilities() : {}; } catch(e) {}
    const sup = (navigator.mediaDevices.getSupportedConstraints && navigator.mediaDevices.getSupportedConstraints()) || {};
    tb.hidden = !(tr && facing === 'environment' && caps.torch !== false && (caps.torch || sup.torch));
  }

    let base = {}; try { base = tr.getConstraints ? {...tr.getConstraints()} : {}; } catch(e) {}
    delete base.torch; delete base.advanced;

      try { await tr.applyConstraints({...base, torch: {exact: on}}); }
      catch(e) { if(e && e.name === 'OverconstrainedError') throw e; await tr.applyConstraints({...base, advanced: [{torch: on}]}); }

    } catch(e) { tb.hidden = true; torchOn = false; if(on) toast('Подсветки у этой камеры нет', true); }
  }

  v.muted = true; v.defaultMuted = true; v.playsInline = true;
  // Просмотр рисуется на холсте из видеопотока: на iPhone и iPad сам <video> с камерой в приложении с экрана «Домой» может оставаться чёрным
  let raf = 0, waitTap = false;
  function fitPv(){ const r = Math.min(2, window.devicePixelRatio || 1); pv.width = Math.max(1, Math.round(pv.clientWidth * r)); pv.height = Math.max(1, Math.round(pv.clientHeight * r)); }
  function paint(){

    if(!v.videoWidth || v.readyState < 2) return;
    if(pv.width !== Math.round(pv.clientWidth * Math.min(2, window.devicePixelRatio || 1))) fitPv();
    const k = Math.min(pv.width / v.videoWidth, pv.height / v.videoHeight), w = v.videoWidth * k, hh = v.videoHeight * k;
    pvx.fillStyle = '#000'; pvx.fillRect(0, 0, pv.width, pv.height);
    pvx.drawImage(v, (pv.width - w) / 2, (pv.height - hh) / 2, w, hh);
  }
  const playV = () => v.play().then(() => { if(waitTap){ waitTap = false; cc.textContent = shot ? `Снято: ${shot}` : 'Наведите камеру и нажимайте кнопку — каждый снимок сразу добавляется'; } }).catch(() => {
    waitTap = true; cc.textContent = 'Коснитесь экрана, чтобы включить камеру';
  });
  pv.addEventListener('click', () => { if(v.paused) playV(); });
  async function start(){
    stop();
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: facing}, width: {ideal: 1920}, height: {ideal: 1440}}});
      if(closed){ stop(); return; }

      if(!raf){ fitPv(); paint(); }
    } catch(e) {
      close();
      toast(FRAMED ? 'Внутри окна Claude камера недоступна — откройте журнал с экрана «Домой»' : 'Нет доступа к камере. Разрешите его в Настройки → Safari → Камера или снимайте через «+ Фото»', true);
    }

    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
    const t = document.createElement('canvas'), ts = 112 / Math.max(c.width, c.height);
    t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts); t.className = 'cam-th';
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height); th.prepend(t); while(th.children.length > 3) th.lastChild.remove();
    queue = queue.then(() => new Promise(res => c.toBlob(res, 'image/jpeg', 0.9)))
      .then(b => { c.width = c.height = 0; if(!b) throw new Error('кадр не получен'); return onShot(new File([b], `IMG_${Date.now()}.jpg`, {type: 'image/jpeg'})); })

  }
  async function close(){
    if(closed) return; closed = true; stop(); cancelAnimationFrame(raf); raf = 0; v.srcObject = null;

  }

    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); }

  };
  const onVis = () => { if(document.visibilityState === 'visible' && !closed && (!stream || stream.getVideoTracks().every(t => t.readyState === 'ended'))) start(); };
  document.addEventListener('keydown', onKey, true); document.addEventListener('visibilitychange', onVis);
  $('[data-shot]', ov).onclick = take;
  $('[data-done]', ov).onclick = close;
  $('[data-flip]', ov).onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; start(); };
  start();
}
function mountPics(box, f, ref){

/* ===================== Дефекты ===================== */
function blankDefect(){
  return { axes: {n: [], l: []}, axesText: '', locText: '', floor: '', construction: '', element: '', typeCode: '', typeName: '', descr: '',
    ptype: '', pu: 'mm', w: '', len: '', wid: '', depth: '', area: '', vol: '', qty: '', sev: '', kts: '', gost: '', photos: '', note: '', pics: [], plan: null, mc: '' };
}
function ptypeOf(d){
  if(d.ptype) return d.ptype;
  if(d.w) return 'crack';
  if(d.wid || d.area) return 'other';
  return !d.typeName || /трещ/i.test(d.typeName) ? 'crack' : 'other';
}
function fmtQ(v, digits){ return v === null || v === undefined ? '' : v.toLocaleString('ru-RU', {maximumFractionDigits: digits}); }
function calcSV(d){
  const L = num(d.len), B = num(d.wid), Hh = num(d.depth);   // всё в миллиметрах
  const S = L !== null && B !== null ? L * B / 1e6 : null;
  return {S, V: S !== null && Hh !== null ? L * B * Hh / 1e9 : null};
}


function paramsStr(d){
  const p = [];
  if(ptypeOf(d) === 'crack'){
    if(d.w) p.push(`a = ${d.w} мм`); if(d.depth) p.push(`h = ${d.depth} мм`); if(d.len) p.push(`L = ${d.len} мм`);
  } else {
    const {S, V} = calcSV(d);
    if(d.len) p.push(`L = ${d.len} мм`); if(d.wid) p.push(`B = ${d.wid} мм`); if(d.depth) p.push(`h = ${d.depth} мм`);
    if(S !== null) p.push(`S = ${fmtSig(S)} м²`); else if(d.area) p.push(`S = ${d.area} м²`);
    if(V !== null) p.push(`V = ${fmtSig(V)} м³`);
  }
  if(d.qty) p.push(`${d.qty} шт.`);
  return p.join(', ');
}


function lastNumTok(s){ const m = String(s || '').match(/(\d+)(?!.*\d)/); return m ? m[1] : null; }
function nextPhoto(val, last){ const t = lastNumTok(val) || lastNumTok(last); return t ? String(+t + 1).padStart(t.length, '0') : null; }
function nextDefectNo(o){ return o.defects.reduce((m, d) => Math.max(m, d.no || 0), 0) + 1; }

function defectForm(id, preset, opts = {}){

  const f = ex ? clone(ex) : Object.assign(blankDefect(), clone(preset || {}));
  f.pics = f.pics || [];
  const ref = {added: []};
  const label = () => groupLabel(o, 'defect', f.plan, f.id, String(ex ? ex.no : nextDefectNo(o)));
  const body = h(`<div>
    ${f._from ? `<p class="notice">Новый дефект в том же месте, что и № ${esc(f._from)}: его номер добавится к той же выноске через «;». Оси, этаж и конструкция скопированы — впишите наименование и сохраните.</p>` : ''}
    ${placeFieldsHTML(f, o, 'd')}

function typePicker(onPick){
  const o = cur();
  const body = h(`<div><input type="search" class="inp" placeholder="Найдите в справочнике или впишите свой вариант" autocomplete="off"><div class="tp-list"></div></div>`);
  const q = $('input', body), list = $('.tp-list', body);
  const recent = [...new Set(o.defects.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).map(d => d.typeName).filter(Boolean))].slice(0, 6);
  const item = c => `<button type="button" class="tp-item" data-code="${esc(c.code || '')}" data-name="${esc(c.name)}">${c.code ? `<span class="code">${esc(c.code)}</span>` : ''}<span>${esc(c.name)}</span></button>`;
  function draw(){
    const s = q.value.trim().toLowerCase();
    let html = '';
    if(!s && recent.length) html += `<div class="tp-grp">Недавние</div><div class="tp-box">` + recent.map(n => item(db.catalog.find(x => x.name === n) || {code: '', name: n})).join('') + `</div>`;
    const groups = new Map();
    for(const c of db.catalog){
      if(s && !(c.name.toLowerCase().includes(s) || String(c.code || '').toLowerCase().includes(s))) continue;
      const g = c.group || 'Без группы';
      if(!groups.has(g)) groups.set(g, []);
      groups.get(g).push(c);
    }
    for(const [g, items] of groups) html += `<div class="tp-grp">${esc(g)}</div><div class="tp-box">${items.map(item).join('')}</div>`;
    if(s) html += `<button type="button" class="btn tp-custom" data-custom>Записать «${esc(q.value.trim())}» как тип</button>`;
    else if(!groups.size) html += '<p class="muted">Каталог пуст. Заполните его в разделе «Сведения».</p>';
    list.innerHTML = html;
  }
  q.addEventListener('input', draw);
  list.addEventListener('click', e => {
    if(e.target.closest('[data-custom]')){ onPick({code: '', name: q.value.trim()}); closeTop(false); return; }
    const b = e.target.closest('.tp-item'); if(!b) return;
    onPick({code: b.dataset.code, name: b.dataset.name}); closeTop(false);
  });
  draw();
  openSheet('Тип дефекта', body, null);
}

/* ===================== Маяки ===================== */
function isBrittle(b){ return BRITTLE.includes(b.kind); }
const TWO_AXIS = ['Измерительный (щелемер)', 'Угловой измерительный (щелемер)'];
const isTwoAxis = b => TWO_AXIS.includes(b.kind);
// ряд отсчётов: ось 'x' — раскрытие (или единственный отсчёт), 'y' — сдвиг
function series(b, axis = 'x'){
  const pts = [], init = num(axis === 'y' ? b.initialY : b.initial);
  if(b.installed && (init !== null || isBrittle(b) || (axis === 'y' && isTwoAxis(b) && num(b.initial) !== null))) pts.push({d: b.installed, v: init !== null ? init : 0, init: true});
  for(const r of b.readings.slice().sort((x, y) => String(x.date).localeCompare(String(y.date)))){
    let v = num(axis === 'y' ? r.valueY : r.value);
    if(isBrittle(b)) v = r.state === 'Разрыв' ? v : (v === null ? 0 : v);
    if(v !== null && r.date) pts.push({d: r.date, v, brk: r.state === 'Разрыв', r});
  }
  return pts.sort((a, b) => String(a.d).localeCompare(String(b.d)) || (a.init ? -1 : b.init ? 1 : 0));
}

function beaconStatus(b, o){
  const thr = num(o.threshold) ?? 0.1;
  if(isBrittle(b)){
    const brk = b.readings.filter(r => r.state === 'Разрыв').sort((x, y) => String(x.date).localeCompare(String(y.date)))[0];
    if(brk) return {cls: 'warn', text: `разрыв ${fmtDate(brk.date)}`};
    return {cls: 'ok', text: b.readings.length ? 'целый' : 'нет замеров'};
  }
  const last = pts => pts.length >= 2 ? pts[pts.length - 1].v - pts[pts.length - 2].v : null;
  const px = series(b), dx = last(px);
  if(dx === null) return {cls: 'minor', text: px.length ? 'один отсчёт' : 'нет замеров'};
  if(isTwoAxis(b)){
    const dy = last(series(b, 'y'));
    const big = Math.abs(dx) > thr || (dy !== null && Math.abs(dy) > thr);
    return {cls: big ? 'warn' : 'ok', text: `ΔX ${fmtNum(dx, true)}${dy !== null ? `; ΔY ${fmtNum(dy, true)}` : ''} мм`};
  }
  return {cls: Math.abs(dx) <= thr ? 'ok' : 'warn', text: `Δ ${fmtNum(dx, true)} мм`};
}

function nextBeaconNo(o){
  const n = o.beacons.reduce((m, b) => { const t = lastNumTok(b.num); return Math.max(m, t ? +t : 0); }, 0);
  return 'М-' + (n + 1);
}
function chartSVG(pts, small, pts2){
  if(!pts.length) return '';
  const all = pts2 && pts2.length ? pts.concat(pts2) : pts;
  const W = small ? 96 : 340, H = small ? 34 : 180;
  const L = small ? 3 : 42, R = small ? 3 : 12, T = small ? 4 : 12, B = small ? 4 : 26;
  const xs = all.map(p => Date.parse(p.d)), ys = all.map(p => p.v);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if(x1 === x0){ x0 -= 3 * 864e5; x1 += 3 * 864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if(y1 - y0 < 0.2){ const m = (y0 + y1) / 2; y0 = m - 0.1; y1 = m + 0.1; }
  const rough = (y1 - y0) / 3, mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(x => x >= rough) || rough;
  y0 = Math.floor(y0 / step + 1e-9) * step; y1 = Math.ceil(y1 / step - 1e-9) * step;
  if(y1 === y0) y1 = y0 + step;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const line = (ps, cls) => ps.length ? `<path class="line${cls}" d="${ps.map((p, i) => (i ? 'L' : 'M') + X(Date.parse(p.d)).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ')}"/>`
    + ps.map(p => `<circle class="pt${cls}${p.brk ? ' break' : ''}" cx="${X(Date.parse(p.d)).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${small ? 2 : 4}"/>`).join('') : '';
  let grid = '';
  if(!small){
    const nt = Math.round((y1 - y0) / step);
    for(let i = 0; i <= nt; i++){
      const v = y0 + step * i, y = Y(v).toFixed(1);
      grid += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${(+y + 4)}" text-anchor="end">${fmtNum(Math.round(v * 100) / 100)}</text>`;
    }
    const ds = all.map(p => p.d).sort();
    grid += `<text x="${L}" y="${H - 6}">${fmtDate(ds[0])}</text>`;
    if(ds.length > 1 && ds[0] !== ds[ds.length - 1]) grid += `<text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(ds[ds.length - 1])}</text>`;
  }
  return `<svg class="${small ? 'spark' : 'chart'}" viewBox="0 0 ${W} ${H}" ${small ? `width="${W}" height="${H}"` : ''} role="img" aria-label="График отсчётов, мм">
    ${small ? '' : `<g class="grid">${grid}</g>`}${line(pts, '')}${pts2 ? line(pts2, ' y') : ''}</svg>`;
}

      const removed = (ex.pics || []).filter(p => !f.pics.some(q => q.id === p.id));
      Object.assign(ex, f); target = ex;
      removed.forEach(p => MEDIA.del(p.id).catch(() => {}));
    } else { f.id = uid(); f.created = Date.now(); o.beacons.push(f); target = f; }
    syncGroup(o, 'beacon', target);

    toast(`Маяк ${f.num} сохранён`);
  }
  const foot = [];
  if(ex) foot.push(btn('Удалить', 'danger', async () => {
    if(!(await ask(`Удалить маяк ${ex.num} вместе со всеми замерами и фото?`, {ok: 'Удалить', danger: true}))) return;
    o.beacons = o.beacons.filter(b => b !== ex);
    const ids = [...(ex.pics || []), ...f.pics, ...ex.readings.flatMap(r => r.pics || [])].map(p => p.id);
    save(); ref.node.committed = true; closeTop(false, 2); render(); toast('Маяк удалён');
    ids.forEach(i => MEDIA.del(i).catch(() => {}));
  }));
  foot.push(btn('Ещё маяк здесь', '', () => commit(true)));
  foot.push(btn('Сохранить', 'primary', () => commit(false)));
  ref.node = openSheet(ex ? `Маяк ${ex.num}` : 'Новый маяк', body, foot, {trackDirty: true, replace: !!opts.replace});
  ref.node.onClose = () => { if(!ref.node.committed) ref.added.forEach(i => MEDIA.del(i).catch(() => {})); };
  if(preset && preset.plan) ref.node.dirty = true;
}

/* ===================== Выгрузка: файлы ===================== */
let dlPromise = null;
function downloadsCap(){
  if(!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
async function deliver(name, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  const dl = await downloadsCap();
  if(dl){
    try { await dl.save({filename: name, data: blob}); return true; }
    catch(e) {
      const code = e && e.code;
      if(code === 'declined') return false;
      if(code === 'rate_limited') toast('Окно сохранения уже открыто — подождите и повторите', true);
      else toast('Сохранить файл здесь не получилось' + (e && e.message ? ': ' + e.message : ''), true);
      return false;
    }
  }
  if(FRAMED){ toast('Сохранение файлов в этом окне недоступно', true); return false; }
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if(coarse && navigator.canShare){
    try {
      const file = new File([blob], name, {type: mime});
      if(navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return true; }
    } catch(e) { if(e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  return true;
}
async function offerFile(name, data, mime, opts = {}){
  const blob = new Blob([data], {type: mime});
  if(await downloadsCap()){ if(opts.replace) closeTop(false); await deliver(name, blob, mime); return; }
  const body = h(`<div><p style="margin-top:0;overflow-wrap:anywhere"><b>${esc(name)}</b></p><p class="muted small">Размер: ${fmtMB(blob.size)}</p>

  const docRels = `${xml}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${media.map(m => `<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join('')}</Relationships>`;
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const core = `${xml}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe('Ведомость — ' + o.name)}</dc:title><dc:creator>Полевой журнал</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
