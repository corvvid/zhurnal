/* ===================== Резервные копии ===================== */
async function backupZip(all){
  const o = cur(), objs = all ? db.objects : (o ? [o] : []);
  try {
    busy('Собираю резервную копию…');
    await ensureFflate();
    const {zipSync, strToU8} = window.fflate;
    const data = {app: 'polevoy-zhurnal', version: 2, exported: new Date().toISOString(), scope: all ? 'all' : 'object',
      objects: objs, catalog: db.catalog, constructions: db.constructions};
    const files = {'data.json': strToU8(JSON.stringify(data))};
    const ids = [...mediaIds(objs)]; let i = 0;
    for(const id of ids){
      busy(`Собираю копию: файл ${++i} из ${ids.length}…`);
      const b = await MEDIA.get(id); if(b) files['media/' + id] = [new Uint8Array(await b.arrayBuffer()), {level: 0}];
    }
    const u8 = zipSync(files, {level: 6});
    busy(null);
    offerFile(all ? `Журнал_все_объекты_${today()}.zip` : `Журнал_${safeName(o && o.name)}_${today()}.zip`, u8, 'application/zip');
  } catch(e) { busy(null); toast('Копия не собралась: ' + e.message, true); }
}
async function importBackup(file){
  try {
    let d, mf = {};
    if(/\.zip$/i.test(file.name) || /zip/.test(file.type)){
      busy('Читаю архив…');
      await ensureFflate();
      const z = window.fflate.unzipSync(new Uint8Array(await file.arrayBuffer()));
      if(!z['data.json']) throw new Error('в архиве нет data.json');
      d = JSON.parse(window.fflate.strFromU8(z['data.json']));
      for(const k in z) if(k.startsWith('media/') && z[k].length) mf[k.slice(6)] = z[k];
    } else d = JSON.parse(await file.text());
    busy(null);
    if(!d || !Array.isArray(d.objects)) throw new Error('файл не похож на резервную копию журнала');
    let added = 0, replaced = 0; const accepted = [];
    for(const ob of d.objects){
      if(!ob || !ob.id) continue;
      normalizeObject(ob);
      const i = db.objects.findIndex(x => x.id === ob.id);
      if(i >= 0){ if(await ask(`Объект «${ob.name}» уже есть. Заменить его версией из файла?`, {ok: 'Заменить'})){ db.objects[i] = ob; replaced++; accepted.push(ob); } }
      else { db.objects.push(ob); added++; accepted.push(ob); }
    }
    const catDiff = Array.isArray(d.catalog) && JSON.stringify(d.catalog) !== JSON.stringify(db.catalog);
    const conDiff = Array.isArray(d.constructions) && JSON.stringify(d.constructions) !== JSON.stringify(db.constructions);
    if((catDiff || conDiff) && await ask('Заменить каталог дефектов и список конструкций версиями из файла?', {ok: 'Заменить', cancel: 'Оставить мои'})){
      if(catDiff) db.catalog = d.catalog; if(conDiff) db.constructions = d.constructions;
    }
    const ids = [...mediaIds(accepted)].filter(id => mf[id]); let i = 0;
    for(const id of ids){ busy(`Восстанавливаю файлы: ${++i} из ${ids.length}…`); await MEDIA.put(id, new Blob([mf[id]], {type: 'image/jpeg'})); dropURL(id); imgCache.delete(id); }
    busy(null); inkCache.clear();
    if(!cur() && db.objects.length) db.currentId = db.objects[0].id;
    save(); render(); toast(`Импорт: добавлено ${added}, заменено ${replaced}`);
  } catch(e) { busy(null); info('Не удалось импортировать: ' + e.message); }
}

}

const ACT_IC = {
  word: svgI('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12l1.2 5 1.8-4 1.8 4 1.2-5"/>'),
  pdf: svgI('<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 9h16M10 9v12" opacity=".55"/><path d="M13 14l2 2 3-4"/>'),
  csv: svgI('<rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 9.5h17M3.5 15h17M9.5 4v16M15 4v16"/>'),
  save: svgI('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/>'),
  load: svgI('<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 19h14"/>')
};
function actRow(icon, title, sub, onClick){
  const b = h(`<button type="button" class="act"><span class="act-ic">${ACT_IC[icon]}</span><span class="act-t"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="act-chev" aria-hidden="true">›</span></button>`);
  b.onclick = onClick; return b;
}
function renderObject(v, o){
  v.innerHTML = '';
  const p = h(`<section class="panel"><h3>Общие сведения</h3>
    <div class="field"><label for="c-nm">Наименование</label><input id="c-nm" class="inp" data-f="name" value="${esc(o.name)}" autocomplete="off"></div>
    <div class="field"><label for="c-ad">Адрес</label><input id="c-ad" class="inp" data-f="address" value="${esc(o.address)}" autocomplete="off"></div>
    <div class="field"><label for="c-ct">Договор</label><input id="c-ct" class="inp" data-f="contract" value="${esc(o.contract)}" autocomplete="off"></div>
    ${axesFieldsHTML(o, 'c')}
    <div class="field"><label for="c-th">Порог изменения по маякам, мм</label><input id="c-th" class="inp" data-f="threshold" inputmode="decimal" value="${esc(o.threshold)}">
      <div class="hint">Изменение за последний интервал больше порога отмечается жёлтым. Порог — по точности прибора.</div></div>
  </section>`);
  let t;
  p.addEventListener('input', e => {
    const k = e.target.dataset.f; if(!k) return;
    o[k] = k === 'name' ? (e.target.value || 'Без названия') : e.target.value;
    clearTimeout(t); t = setTimeout(() => { save(); if(k === 'name') $('.obj-name').textContent = o.name; }, 300);
  });
  wireAxesFields(p, o);
  v.append(p);
  const docs = h(`<section class="panel"><h3>Документы</h3><div class="act-list"></div></section>`);
  $('.act-list', docs).append(
    actRow('word', 'Ведомости и фотоприложение в Word', `Дефекты (${o.defects.length}), маяки (${o.beacons.length}), фото (${o.photos.length}) — альбомный A4`, wordDialog),
    actRow('pdf', 'Листы чертежей в PDF', `${plural(o.drawings.length, ['лист','листа','листов'])} с отметками и записями, в исходном формате`, () => sheetsPdfDialog(o.drawings)));
  const tabs = h(`<section class="panel"><h3>Таблицы для Excel</h3><div class="act-list"></div></section>`);
  $('.act-list', tabs).append(
    actRow('csv', 'Дефекты, CSV', `${plural(o.defects.length, ['строка','строки','строк'])}: оси, параметры, фото, чертёж`, () => { if(!o.defects.length) return toast('Нет дефектов для выгрузки', true); deliver(`Дефекты_${safeName(o.name)}_${today()}.csv`, defectsCSV(o), 'text/csv'); }),
    actRow('csv', 'Маяки и замеры, CSV', `${plural(o.beacons.length, ['маяк','маяка','маяков'])}: все замеры по датам`, () => { if(!o.beacons.length) return toast('Нет маяков для выгрузки', true); deliver(`Маяки_${safeName(o.name)}_${today()}.csv`, beaconsCSV(o), 'text/csv'); }));
  const bk = h(`<section class="panel"><h3>Резервная копия</h3><div class="act-list"></div></section>`);
  $('.act-list', bk).append(
    actRow('save', 'Сохранить копию объекта', 'Всё: дефекты, фото, чертежи, записи, маяки — в один файл .zip', () => backupZip(false)),
    actRow('load', 'Загрузить из копии', 'Восстановить объект из файла .zip — или перенести с другого устройства', () => pickFiles('.zip,.json,application/zip,application/json', false, f => importBackup(f[0]))));
  v.append(docs, tabs, bk);
  const dz = h(`<section class="panel"><h3>Удаление</h3><p class="small muted">Удаляется этот объект со всеми дефектами, фото, чертежами и маяками. Сначала сохраните резервную копию.</p></section>`);
  dz.append(btn('Удалить объект', 'danger small', async () => {
    if(!(await ask(`Удалить объект «${o.name}» (${plural(o.defects.length, ['дефект','дефекта','дефектов'])}, ${plural(o.beacons.length, ['маяк','маяка','маяков'])})? Это необратимо.`, {ok: 'Удалить', danger: true}))) return;
    deleteObject(o).then(() => toast('Объект удалён'));
  }));
  v.append(dz);
}



/* ===================== Запуск ===================== */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
document.getElementById('fab').addEventListener('click', () => {
  if(screen === 'home') objectForm();
  else if(tab === 'beacons') beaconForm();
  else if(tab === 'photos') photoForm();
  else if(tab === 'drawings') addDrawingDialog();
  else defectForm();
});
document.getElementById('view').addEventListener('click', e => {
  const oo = e.target.closest('[data-open-obj]'); if(oo){ openObject(oo.dataset.openObj); return; }
  const pr = e.target.closest('[data-photo]'); if(pr){ photoForm(pr.dataset.photo); return; }
  const ad = e.target.closest('[data-act-dr]');
  if(ad){ const o = cur(), dr = o && o.drawings.find(x => x.id === ad.dataset.actDr); if(dr) drawingActions(dr); return; }
  if(e.target.closest('[data-add-drawing]')){ addDrawingDialog(); return; }
  const od = e.target.closest('[data-open-dr]');
  if(od){ const o = cur(), dr = o && o.drawings.find(x => x.id === od.dataset.openDr); if(dr) openPlan({drawing: dr, mode: 'work'}); return; }
  const r = e.target.closest('.row[data-id]'); if(r){ defectForm(r.dataset.id); return; }
  const b = e.target.closest('.beacon[data-id]'); if(b) beaconDetail(b.dataset.id);
});
document.getElementById('view').addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('[role="button"][data-id]'); if(!t) return;
  e.preventDefault(); t.click();
});

document.addEventListener('touchstart', e => {
  const t = e.target;
  if(!t || !(t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') || /^(checkbox|radio|file|color|date|range)$/.test(t.type) || document.activeElement !== t) return;
  const vv = window.visualViewport, kbOpen = vv && vv.height < window.innerHeight - 120;
  if(!kbOpen) t.blur();
}, {passive: true, capture: true});
load(); render(); gcMedia(); downloadsCap(); probeBlobImages();
try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
if(BUILD.pwa && !FRAMED && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
